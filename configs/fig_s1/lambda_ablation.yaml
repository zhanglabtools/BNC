experiment: fig_s1
protocol: rank_homotopy
formal: true
device: cuda
dense_root: outputs/dense
train_fraction: 0.7
grid:
  architectures: [mlp, transformer, lstm, rnn]
  moduli: [97]
  seeds: [1, 2, 3, 4, 5]
  lambdas: [0.01, 0.1, 0.5, 0.7, 1.0, 1.5, 2.0, 3.0]
model:
  mlp_embedding_dim: 256
  mlp_hidden_dim: 128
rank:
  max_rank: 16
  target_rank: 2
  gate_start: 1
  gate_end: 6000
training:
  epochs: 10000
  lr: 0.001
  min_lr: 0.00001
  weight_decay: 0.5
  betas: [0.9, 0.98]
  target_loss_weight: 1.0

