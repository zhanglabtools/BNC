experiment: fig_s2
protocol: rank2_finetune
formal: true
device: cuda
dense_root: outputs/dense
train_fraction: 0.7
grid:
  architectures: [mlp, transformer, lstm, rnn]
  moduli: [79, 97, 113]
  seeds: [1, 2, 3, 4, 5]
model:
  mlp_embedding_dim: 256
  mlp_hidden_dim: 128
training:
  epochs: 6000
  lr: 0.001
  min_lr: 0.00001
  weight_decay: 0.5
  betas: [0.9, 0.98]
regularizer:
  overall_coefficient: 1.0
  participation_weight: 5.0
  tail_weight: 0.0
  balance_weight: 0.0
  start_epoch: 0
  ramp_epochs: 200

